name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    env:
      # The suite must not depend on a real workspace or a logged-in CLI. Unset
      # anything that could let a test accidentally pass by reaching Databricks.
      DATABRICKS_HOST: ""
      DATABRICKS_TOKEN: ""
      DATABRICKS_CONFIG_FILE: /nonexistent/databrickscfg
      TZ: UTC
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # The plugin itself is standard library only; pytest is the sole test dep.
        run: python -m pip install --upgrade pip "pytest>=8,<9"

      - name: Run tests
        run: python -m pytest tests/ -q

  compile:
    name: byte-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.9"

      - name: Compile every plugin module
        # Catches syntax that only parses on a newer interpreter than the
        # declared 3.9 floor.
        run: python -m compileall -q plugin tests

  packaging:
    name: install script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: install.sh installs into a throwaway HERMES_HOME
        run: |
          set -euo pipefail
          export HERMES_HOME="$RUNNER_TEMP/hermes-home"
          ./install.sh
          test -f "$HERMES_HOME/plugins/databricks/plugin.yaml"
          test -f "$HERMES_HOME/plugins/databricks/skills/databricks/SKILL.md"
          # Bytecode must never be copied into an install.
          ! find "$HERMES_HOME/plugins/databricks" -name '__pycache__' | grep -q .

      - name: install.sh --symlink is idempotent and backs up
        run: |
          set -euo pipefail
          export HERMES_HOME="$RUNNER_TEMP/hermes-home-2"
          ./install.sh --symlink
          ./install.sh --symlink
          test -L "$HERMES_HOME/plugins/databricks"
          ls -d "$HERMES_HOME"/plugins/databricks.bak.* >/dev/null
